# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Release on a pushed `v<version>` tag, in three jobs:
#
# 1. check: scripts/verify-release-tag refuses a tag that is not
#    annotated, not signed, not on the checked-out commit, or whose
#    message is not `jspassgen-sdk-rust v<version>` or whose version is
#    not Cargo.toml's. Then the `make check` gate (which includes
#    `cargo deny` advisories), `cargo package`, and SHA256SUMS over the
#    .crate.
# 2. publish-crate: after a maintainer approves the `crates-io`
#    environment (required reviewer), exchanges the job's OIDC token for
#    a short-lived crates.io token (trusted publishing, so no
#    CARGO_REGISTRY_TOKEN is stored) and runs `cargo publish`. A version
#    already on crates.io is skipped, so a rerun is safe, and so is a
#    first release published by hand. Then it checks that crates.io
#    serves the same .crate the check job built.
# 3. github-release: a draft GitHub release titled `jspassgen-sdk-rust
#    <version>` with the .crate and SHA256SUMS attached, and notes with
#    What's Changed, the checksums and the Full Changelog line. The
#    maintainer writes the Highlights and publishes the draft.
#    The release also carries the SLSA build provenance of its files,
#    signed through Sigstore (<project>-<version>.intoto.jsonl).
#
# crates.io accepts trusted publishing only for a crate that already
# exists, so the very first version is published by hand with an API
# token (DEVELOPMENT.md, Release model).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # crates.io asks API clients to identify themselves.
  CRATES_IO_USER_AGENT: jspassgen-sdk-rust release workflow (https://github.com/sebastienrousseau/jspassgen-sdk-rust)

jobs:
  check:
    name: Check the tag, run the gate, package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      crate: ${{ steps.tag.outputs.crate }}
      version: ${{ steps.tag.outputs.version }}
      file: ${{ steps.package.outputs.file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tag against Cargo.toml
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        # actions/checkout can leave a lightweight copy of the tag; fetch
        # the real tag object before inspecting it.
        run: |
          git fetch --force origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          scripts/verify-release-tag "$TAG" "$GITHUB_SHA"
          crate=$(sed -n 's/^name = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "crate=${crate}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      # The versions CI pins; bump them together with ci.yml.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-deny@0.20.2,rust-code-analysis-cli@0.0.25
      - name: Gate (make check, including cargo deny advisories)
        run: make check
      - name: Package and checksum
        id: package
        env:
          CRATE: ${{ steps.tag.outputs.crate }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          cargo package --locked
          file="${CRATE}-${VERSION}.crate"
          mkdir -p release
          cp "target/package/${file}" release/
          (cd release && sha256sum "$file" > SHA256SUMS && cat SHA256SUMS)
          echo "file=${file}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish-crate:
    name: Publish to crates.io
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Check the .crate against SHA256SUMS
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Skip a version already on crates.io
        id: registry
        env:
          CRATE: ${{ needs.check.outputs.crate }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -A "$CRATES_IO_USER_AGENT" \
            "https://crates.io/api/v1/crates/${CRATE}/${VERSION}")
          case "$status" in
            200)
              echo "::notice::${CRATE} ${VERSION} is already on crates.io; nothing to publish"
              echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io answered HTTP ${status}"; exit 1 ;;
          esac
      - name: Exchange the OIDC token for a crates.io token
        if: steps.registry.outputs.published == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        if: steps.registry.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
      - name: Check crates.io serves the .crate in SHA256SUMS
        env:
          CRATE: ${{ needs.check.outputs.crate }}
          VERSION: ${{ needs.check.outputs.version }}
          FILE: ${{ needs.check.outputs.file }}
          PUBLISHED_BEFORE: ${{ steps.registry.outputs.published }}
        # The index can take a few minutes to show a new version, so poll
        # before failing. A mismatch on a version this job published is an
        # error: the attached .crate is not what crates.io serves. On a
        # version published earlier (by hand, with another cargo) it is a
        # warning, since cargo versions can package the same source
        # differently.
        run: |
          expected=$(awk -v f="$FILE" '$2 == f { print $1 }' release/SHA256SUMS)
          for attempt in $(seq 1 20); do
            served=$(curl -s -A "$CRATES_IO_USER_AGENT" \
              "https://crates.io/api/v1/crates/${CRATE}/${VERSION}" | jq -r '.version.checksum // empty')
            if [ -n "$served" ]; then
              echo "crates.io: ${served}"
              echo "built:     ${expected}"
              [ "$served" = "$expected" ] && exit 0
              if [ "$PUBLISHED_BEFORE" = "true" ]; then
                echo "::warning::crates.io serves a different ${CRATE} ${VERSION} .crate than the one built here"
                exit 0
              fi
              echo "::error::crates.io serves a different ${CRATE} ${VERSION} .crate than the one built here"
              exit 1
            fi
            echo "Attempt ${attempt}: ${CRATE} ${VERSION} not visible yet; retrying in 30s."
            sleep 30
          done
          echo "::error::${CRATE} ${VERSION} is still not visible on crates.io after 10 minutes"
          exit 1

  github-release:
    name: Draft the GitHub release
    needs: [check, publish-crate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release and upload its assets
      id-token: write # sign the build provenance through Sigstore
      attestations: write # store the provenance as a GitHub attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      # SLSA build provenance for every release file, signed through
      # Sigstore and stored as a GitHub attestation of this run. Its
      # Sigstore bundle (the signed in-toto statement) is attached as
      # <project>-<version>.intoto.jsonl, so the release carries its own
      # provenance. Check an asset with
      # `gh attestation verify <file> --repo <owner>/<repo>`; add
      # `--bundle <project>-<version>.intoto.jsonl` to check it against
      # the attached bundle.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Attach the provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          PROJECT: ${{ github.event.repository.name }}
          VERSION: ${{ needs.check.outputs.version }}
        run: cp "$BUNDLE" "release/${PROJECT}-${VERSION}.intoto.jsonl"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PROJECT: ${{ github.event.repository.name }}
          VERSION: ${{ needs.check.outputs.version }}
        # The generated notes end with the Full Changelog line; the
        # checksums go just before it, as the release standard orders them.
        run: |
          gh api "repos/${REPO}/releases/generate-notes" -f tag_name="$TAG" --jq .body > generated.md
          {
            echo "## Highlights ⭐️"
            echo
            grep -v '^\*\*Full Changelog\*\*' generated.md
            echo
            echo "## Checksums"
            echo
            echo "SHA-256 of every asset attached to this release:"
            echo
            echo '```text'
            cat release/SHA256SUMS
            (cd release && sha256sum -- SHA256SUMS *.intoto.jsonl)
            echo '```'
            echo
            grep '^\*\*Full Changelog\*\*' generated.md || true
          } > notes.md
          gh release create "$TAG" release/* --repo "$REPO" --draft \
            --title "${PROJECT} ${VERSION}" --notes-file notes.md --verify-tag
