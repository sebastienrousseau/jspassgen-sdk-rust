# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Format, lint, complexity, build and test on stable and on the minimum
# supported Rust (rust-version in Cargo.toml), coverage (lines and
# regions), the dependency policy (cargo-deny) and the release checks.
# Together these are `make check`.
name: CI

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: make fmt-check
      - name: Clippy (pedantic, complexity lints)
        run: make lint
      - name: Docs
        run: make doc

  test:
    name: Build and tests (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # stable, and the MSRV: keep 1.85.0 equal to rust-version. The
        # random source is the operating system's, so each OS family
        # runs the tests on stable.
        os: [ubuntu-latest]
        toolchain: [stable, 1.85.0]
        include:
          - os: macos-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Build
        run: cargo build --locked --all-targets --all-features
      - name: Unit, statistical and doc tests
        run: cargo test --locked --all-features

  complexity:
    name: Complexity ceilings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version the baseline was measured with; bump both together.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: rust-code-analysis-cli@0.0.25
      - name: Cyclomatic, cognitive, Halstead and length per function
        run: make complexity

  release-checks:
    name: Versions and package contents
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Every version restatement agrees with Cargo.toml
        run: make versions
      - name: The package ships no repository-only file
        run: make package-check

  coverage:
    name: Coverage (100% lines and regions)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Coverage gate
        run: make coverage

  deny:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Advisories, licences, bans, sources
        run: make deny
