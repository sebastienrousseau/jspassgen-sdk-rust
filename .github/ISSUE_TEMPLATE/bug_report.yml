# SPDX-License-Identifier: Apache-2.0 OR MIT
name: Bug Report
description: Report a reproducible problem in jspassgen-sdk-rust
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: input
    id: version
    attributes:
      label: jspassgen-sdk-rust Version or Commit
      placeholder: "0.0.23"
    validations:
      required: true
  - type: input
    id: rust_version
    attributes:
      label: Rust Version
      description: The output of `rustc --version`.
      placeholder: "rustc 1.85.0"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - RandomSource or OsRandom
        - Error
        - Build or toolchain
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal Reproducer
      description: |
        The smallest Rust snippet that shows the problem. Never paste a
        password or secret you use.
      render: rust
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error Output
      description: The `Error` you got (its `Display` or `Debug` form).
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything Else
